# Gitleaks configuration for OpsIQ.
# Extends the default gitleaks rules and allowlists the known, non-sensitive
# placeholders/fixtures that exist in this repository so the CI secret-scan
# job stays signal-only (no noise) while still catching real leaks.
title = "OpsIQ gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known test/placeholder secrets, example templates, and fixture data"
paths = [
  '''(?i)\.env\.example$''',
  '''(?i)\.env\.docker\.example$''',
  '''(?i)fixtures/''',
  '''(?i)demo_data/''',
  '''(?i)package-lock\.json$''',
  '''(?i)\.md$''',
  '''(?i)node_modules/''',
]
regexes = [
  '''(?i)sk-test-key''',
  '''(?i)sk-dummy-key''',
  '''(?i)your[-_ ]?key''',
  '''(?i)example''',
  '''(?i)placeholder''',
  '''(?i)changeme''',
  '''(?i)dummy''',
  '''(?i)fake''',
  '''(?i)xxxx''',
  '''(?i)REPLACE''',
  # Documented local-dev API key (never valid outside localhost dev setups;
  # appears as the default in test helpers and local curl recipes).
  '''(?i)opsiq-dev-key''',
  # Historical fake example key (commit 29f4931b, removed since): the tail is
  # a hand-typed alphabet walk, never a real Google credential.
  '''xK9mNpQrStUvWxYz''',
]
