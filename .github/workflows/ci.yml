# ── OpsIQ CI/CD Pipeline ───────────────────────────────────
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Lint & Type Check ─────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check ecommerce_ops/ --output-format=github

      - name: Ruff format check
        run: ruff format --check ecommerce_ops/

      - name: Ban datetime.utcnow (must use ecommerce_ops.utils.utc_now)
        run: |
          # Regression guard for the time-consistency sweep: never call the
          # deprecated datetime.utcnow() in app code. ecommerce_ops.utils.utc_now()
          # returns naive UTC, compatible with SQLAlchemy. (models/db.py defines a
          # delegating `def utcnow()` helper, which is not a banned call site.)
          if grep -rn "datetime\.utcnow(" ecommerce_ops --include="*.py"; then
            echo "::error::datetime.utcnow() found — use ecommerce_ops.utils.utc_now instead"
            exit 1
          fi
          echo "::Notice::No datetime.utcnow() calls"

      - name: Mypy type check
        # Whole-package strict mypy is ~800 pre-existing errors (audit debt, see
        # W1-W2). The gate is scoped to the reliability-wave modules we own so it
        # stays meaningful; extend the file list as modules reach full coverage.
        run: mypy ecommerce_ops/connectors/shopify/webhooks.py ecommerce_ops/connectors/shopify/handlers/order_handlers.py ecommerce_ops/pipeline/outbox.py ecommerce_ops/memory/cache.py --follow-imports=skip --ignore-missing-imports --no-error-summary

  # ── Migration Drift Check ──────────────────────────────────
  migration-check:
    name: Migration Drift Check
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ops_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ecommerce_ops_migrate
      ENV: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Check for drift
        run: |
          # alembic check exits 1 when models diverge from migration state.
          # (The old autogenerate --sql approach was invalid: alembic rejects
          # --sql with --autogenerate, so this gate could never pass.)
          if alembic check; then
            echo "No migration drift detected"
          else
            echo "::error title=migration drift::Models diverge from alembic migrations. Run 'alembic revision --autogenerate -m <msg>' locally and commit the new revision."
            exit 1
          fi

  # ── Unit Tests ────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ecommerce_ops_test
      REDIS_URL: redis://localhost:6379/0
      ENV: testing
      DEEPSEEK_API_KEY: sk-test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Run unit tests
        run: |
          mkdir -p test-results
          python -m pytest tests/ \
            -v \
            --tb=short \
            -m "not slow" \
            -k "not test_e2e" \
            --junitxml=test-results/unit-tests.xml \
            --cov=ecommerce_ops \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            || { python scripts/pytest_annotations.py test-results/unit-tests.xml; exit 1; }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── E2E Integration Tests ────────────────────────────────
  test-e2e:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ops_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ecommerce_ops_e2e
      REDIS_URL: redis://localhost:6379/0
      ENV: testing
      DEEPSEEK_API_KEY: sk-test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Run E2E tests
        run: |
          mkdir -p test-results
          python -m pytest tests/test_e2e_integration.py \
            -v \
            --tb=short \
            --no-cov \
            --junitxml=test-results/e2e-tests.xml \
            || { python scripts/pytest_annotations.py test-results/e2e-tests.xml; exit 1; }

  # ── Security Scan (Fail on CRITICAL/HIGH) ─────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Scan git history for secrets (Gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks git --config .gitleaks.toml --exit-code=1 --no-banner --redact

      - name: Install security tools
        run: pip install pip-audit bandit

      - name: Audit Python dependencies
        # PYSEC-2026-* entries are starlette <1.3.1 advisories. A fix needs a
        # coordinated fastapi + opentelemetry-instrumentation-fastapi bump
        # (0.53b0 caps starlette); tracked as follow-up. Re-run without
        # --ignore-vuln after that upgrade lands.
        run: >
          pip-audit -r requirements.txt --desc --ignore-vuln PYSEC-2024-*
          --ignore-vuln PYSEC-2026-1941 --ignore-vuln PYSEC-2026-1942
          --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-248

      - name: Bandit SAST scan
        run: bandit -r ecommerce_ops/ -ll --skip B101,B311,B324 --format json --output bandit-report.json || true

      - name: Bandit summary
        if: always()
        run: bandit -r ecommerce_ops/ -ll --skip B101,B311,B324

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Docker Build + Trivy Scan ─────────────────────────────
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [test-unit, test-e2e, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: opsiq-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opsiq-api:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy vulnerability scan (HIGH — advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opsiq-api:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # ── Frontend CI ──────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests + coverage
        working-directory: frontend
        run: npx vitest run --reporter=verbose --coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Frontend E2E (Playwright) ────────────────────────────
  e2e-frontend:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ops_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ecommerce_ops_e2e
      REDIS_URL: redis://localhost:6379/0
      ENV: testing
      DEEPSEEK_API_KEY: sk-test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Start backend
        run: |
          nohup uvicorn ecommerce_ops.api.app:app --host 127.0.0.1 --port 8000 > /tmp/opsiq-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/opsiq-api.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

  # ── Performance Benchmarks ────────────────────────────────
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ops_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ecommerce_ops_bench
      REDIS_URL: redis://localhost:6379/0
      ENV: testing
      DEEPSEEK_API_KEY: sk-test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[test]"

      - name: Run benchmarks
        run: |
          mkdir -p test-results
          python -m pytest tests/test_performance.py \
            -v \
            -s \
            --tb=short \
            --no-cov \
            --junitxml=test-results/bench-tests.xml \
            || { python scripts/pytest_annotations.py test-results/bench-tests.xml; exit 1; }
