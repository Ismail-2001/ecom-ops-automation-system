# ── Secret Scanning ───────────────────────────────────────────
# Defence-in-depth: blocks accidental commits of secrets.
# Complements (does not replace) GitHub native Secret Scanning /
# Push Protection, which should also be enabled in repo settings.
name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the complete diff/history.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
